$kind: http-request
name: Record Match
method: POST
url: '{{baseUrl}}/api/matches'
order: 1000
headers:
  - key: Content-Type
    value: application/json
body:
  type: json
  content: |-
    {
      "matchType": "DOMINO_INDIVIDUAL",
      "winningTeam": ["{{winnerPlayerId}}"],
      "losingTeam": ["{{loserPlayerId}}"],
      "winningPoints": 100,
      "losingPoints": 50
    }
scripts:
  - type: afterResponse
    language: text/javascript
    code: |-
      pm.test("Status is 201", () => pm.response.to.have.status(201));
      pm.test("Match has _id", () => {
        const json = pm.response.json();
        pm.expect(json).to.have.property("_id");
        pm.collectionVariables.set("matchId", json._id);
      });
