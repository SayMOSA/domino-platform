$kind: http-request
name: Change Password
method: PATCH
url: '{{baseUrl}}/api/auth/change-password'
order: 5000
headers:
  - key: Content-Type
    value: application/json
body:
  type: json
  content: |-
    {
      "newPassword": "{{newPassword}}"
    }
scripts:
  - type: afterResponse
    language: text/javascript
    code: |-
      pm.test("Status is 200", () => pm.response.to.have.status(200));
