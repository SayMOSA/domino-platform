$kind: http-request
name: Refresh Token
method: POST
url: '{{baseUrl}}/api/auth/refresh'
order: 6000
auth:
  type: bearer
  credentials:
    - key: token
      value: '{{refreshToken}}'
scripts:
  - type: afterResponse
    language: text/javascript
    code: |-
      pm.test("Status is 201", () => pm.response.to.have.status(201));
      pm.test("Returns new accessToken", () => {
        const json = pm.response.json();
        pm.expect(json).to.be.a("string");
        pm.collectionVariables.set("accessToken", json);
      });
