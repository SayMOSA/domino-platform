$kind: http-request
name: Register
method: POST
url: '{{baseUrl}}/api/auth/register'
order: 1000
auth:
  type: noauth
body:
  type: formdata
  content:
    - key: name
      type: text
      value: 'John Doe'
    - key: nickname
      type: text
      value: 'johndoe'
    - key: email
      type: text
      value: '{{email}}'
    - key: password
      type: text
      value: '{{password}}'
scripts:
  - type: afterResponse
    language: text/javascript
    code: |-
      pm.test("Status is 201", () => pm.response.to.have.status(201));
      pm.test("Response has message", () => {
        const json = pm.response.json();
        pm.expect(json).to.have.property("message");
      });
