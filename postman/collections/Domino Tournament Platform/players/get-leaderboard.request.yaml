$kind: http-request
name: Get Leaderboard
method: GET
url: '{{baseUrl}}/api/players?page=1&limit=10'
order: 7000
queryParams:
  - key: page
    value: '1'
  - key: limit
    value: '10'
scripts:
  - type: afterResponse
    language: text/javascript
    code: |-
      pm.test("Status is 200", () => pm.response.to.have.status(200));
      pm.test("Response is object or array", () => {
        const json = pm.response.json();
        pm.expect(json).to.satisfy(v => typeof v === "object");
      });
