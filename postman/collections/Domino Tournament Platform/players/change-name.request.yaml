$kind: http-request
name: Change Name
method: PATCH
url: '{{baseUrl}}/api/players/change-name'
order: 3000
headers:
  - key: Content-Type
    value: application/json
body:
  type: json
  content: |-
    {
      "newName": "{{newName}}"
    }
scripts:
  - type: afterResponse
    language: text/javascript
    code: |-
      pm.test("Status is 200", () => pm.response.to.have.status(200));
