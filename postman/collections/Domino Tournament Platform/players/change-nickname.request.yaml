$kind: http-request
name: Change Nickname
method: PATCH
url: '{{baseUrl}}/api/players/change-nickname'
order: 4000
headers:
  - key: Content-Type
    value: application/json
body:
  type: json
  content: |-
    {
      "newNickname": "{{newNickname}}"
    }
scripts:
  - type: afterResponse
    language: text/javascript
    code: |-
      pm.test("Status is 200", () => pm.response.to.have.status(200));
