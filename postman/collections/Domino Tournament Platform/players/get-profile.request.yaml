$kind: http-request
name: Get My Profile
method: GET
url: '{{baseUrl}}/api/players/profile'
order: 1000
scripts:
  - type: afterResponse
    language: text/javascript
    code: |-
      pm.test("Status is 200", () => pm.response.to.have.status(200));
      pm.test("Profile has _id", () => {
        const json = pm.response.json();
        pm.expect(json).to.have.property("_id");
      });
